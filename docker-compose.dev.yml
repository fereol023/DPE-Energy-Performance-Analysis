# docker compose --file docker-compose.dev.yml stop  
# docker compose --file docker-compose.dev.yml up -d --build
services:

  db:
    image: postgres
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - ./DPE-Energy-Performance-Analysis-ETL/.volume/postgres:/var/lib/postgresql/data
    shm_size: 128mb # ✅ shared memory size conservée
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    networks:
      - dpe-bridge
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  minio:
    image: "minio/minio:latest"
    restart: always
    ports:
      - "9000:9000"
      - "8900:8900"
    volumes:
      - ./DPE-Energy-Performance-Analysis-ETL/.volume/minio:/data/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: 'minio server /data/minio --console-address ":8900"'
    networks:
      - dpe-bridge
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  prefect-server:
    image: prefecthq/prefect:3-python3.12
    restart: always
    ports:
      - "4200:4200"
      - "4201:4201"
    entrypoint: ["prefect", "server", "start"]
    command: ["--host", "0.0.0.0", "--port", "4200"]
    volumes:
      - ./DPE-Energy-Performance-Analysis-ETL/.volume/prefect:/root/.prefect
    networks:
      - dpe-bridge
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1.5G
        reservations:
          cpus: "0.5"
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./DPE-Energy-Performance-Analysis-ETL/.volume/redis:/data
    networks:
      - dpe-bridge
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./DPE-Energy-Performance-Analysis-ETL/.volume/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - dpe-bridge
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - dpe-bridge
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

networks:
  dpe-bridge:
    driver: bridge
