services:

  traefik:
    image: traefik:v2.11
    container_name: dpe-traefik-fullstack
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.webadmin.address=:8005
      - --api.insecure=true
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --log.level=DEBUG
    ports:
      - "80:80"
      - "8005:8005"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dpe-bridge
    mem_limit: 128m
    cpus: 0.5

  dpe-dashboarding-tool:
    image: fereol023/dpe-energy-performance-analysis-clientapp:${VERSION_DASHBORD}
    container_name: dpe-dashoard-fullstack
    ports:
      - 8501:8501
    depends_on:
      - api
      - minio
    environment:
      SERVER_API_URL: http://api:8000
      S3_ACCESS_KEY: ${AWS_S3_STREAMLIT_ACCESS_KEY}
      S3_SECRET_KEY: ${AWS_S3_STREAMLIT_SECRET_KEY}
      S3_BUCKET_NAME: ${AWS_S3_STREAMLIT_BUCKET_NAME}
    networks:
      - dpe-bridge
    mem_limit: 1g
    cpus: 1.0

  api:
    image: fereol023/dpe-energy-performance-analysis-api:${VERSION_API}
    depends_on:
      - db
      - minio
      - redis
      - prefect-server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`localhost`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.api-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.api.middlewares=api-strip"
      - "traefik.http.routers.dashboard.rule=Host(`localhost`) && PathPrefix(`/dashboard`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=auth"
      #- "traefik.http.middlewares.auth.basicauth.users=test:password"
    environment:
      ENV: ${ENV}
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SMTP_SERVER: "smtp.gmail.com"
      SMTP_PORT: "465"
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB_NAME: ${POSTGRES_DB_NAME}
      POSTGRES_ADMIN_USERNAME: ${POSTGRES_ADMIN_USERNAME}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_READER_USERNAME: ${POSTGRES_READER_USERNAME}
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD}
      POSTGRES_WRITER_USERNAME: ${POSTGRES_WRITER_USERNAME}
      POSTGRES_WRITER_PASSWORD: ${POSTGRES_WRITER_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: eu-west
      S3_ENDPOINT_URL: minio:9000
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_UI_URL: http://localhost:4200
      PATH_LOG_DIR: etl/logs/
      PATH_ARCHIVE_DIR: etl/data/archive/
      PATH_DATA_BRONZE: etl/data/1_bronze/
      PATH_DATA_SILVER: etl/data/2_silver/
      PATH_DATA_GOLD: etl/data/3_gold/
      PATH_FILE_INPUT_ENEDIS_CSV: etl/data/1_bronze/conso_enedis.csv
      SCHEMA_ETL_INPUT_FILEPATH: config/schema_input_data.json
      SCHEMA_SILVER_DATA_FILEPATH: etl/ressources/schemas/schema_silver_data.json
      SCHEMA_GOLDEN_DATA_FILEPATH: config/schema_golden_data.json
    networks:
      - dpe-bridge
    mem_limit: 2.5g
    cpus: 2.0

  for-fastapi-swagger:
    image: fereol023/dpe-energy-performance-analysis-api:${VERSION_API}
    depends_on:
      - db
      - minio
      - redis
      - prefect-server
    environment:
      ENV: ${ENV}
      API_HOST: "0.0.0.0"
      API_PORT: "8001"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SMTP_SERVER: "smtp.gmail.com"
      SMTP_PORT: "465"
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    ports:
      - 8001:8001
    networks:
      - dpe-bridge
    mem_limit: 512m
    cpus: 1

  db:
    image: postgres
    container_name: dpe-dbserver-fullstack
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - ./DPE-Energy-Performance-Analysis-API/storage/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    networks:
      - dpe-bridge
    shm_size: 128mb # shared memory size when using docker-compose
    mem_limit: 1g
    cpus: 1.0

  minio:
    image: "minio/minio:latest"
    container_name: dpe-filestorage-fullstack
    restart: always
    ports:
      - "9000:9000"
      - "8900:8900"
    volumes:
      - ./DPE-Energy-Performance-Analysis-API/storage/minio:/data/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: 'minio server /data/minio --console-address ":8900"'
    networks:
      - dpe-bridge
    mem_limit: 512m
    cpus: 1.0

  prefect-server:
    image: prefecthq/prefect:3-python3.12
    container_name: dpe-prefect-server-fullstack
    restart: always
    ports:
      - "4200:4200"
      - "4201:4201"
    entrypoint: ["prefect", "server", "start"]
    command: ["--host", "0.0.0.0", "--port", "4200"]
    volumes:
      - ./DPE-Energy-Performance-Analysis-API/storage/prefect:/root/.prefect
    networks:
      - dpe-bridge
    mem_limit: 512m
    cpus: 1

  redis:
    image: redis:7-alpine
    container_name: dpe-redis-fullstack
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./DPE-Energy-Performance-Analysis-API/storage/redis:/data
    networks:
      - dpe-bridge
    mem_limit: 128m
    cpus: 0.25

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./DPE-Energy-Performance-Analysis-API/storage/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - dpe-bridge
    mem_limit: 128m
    cpus: 0.5

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    depends_on:
      - prometheus
    networks:
      - dpe-bridge
    volumes:
      - ./DPE-Energy-Performance-Analysis-API/storage/grafana:/var/lib/grafana
    mem_limit: 256m
    cpus: 0.5

networks:
  dpe-bridge:
    driver: bridge
